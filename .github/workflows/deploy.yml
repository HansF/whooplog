name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
      HUGO_ENVIRONMENT: production
      TZ: Europe/Brussels
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive # themes/hextra — without this the build finds no theme
          fetch-depth: 0 # required by enableGitInfo for real lastmod dates

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Hextra v0.12.1 ships precompiled Tailwind CSS and contains no SCSS,
      # so no Dart Sass and no npm install are needed here.
      - name: Build
        run: |
          hugo \
            --gc \
            --minify \
            --cleanDestinationDir \
            --printPathWarnings \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
