baseURL = 'https://hansf.github.io/whooplog/'
locale = 'en-us'
title = 'whooplog'
theme = 'hextra'
enableRobotsTXT = true
enableGitInfo = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
  [markup.highlight]
    noClasses = false

[frontmatter]
  lastmod = [':git', 'lastmod', ':fileModTime', ':default']

[taxonomies]
  tag = 'tags'
  craft = 'craft'

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[[menus.main]]
  identifier = "blog"
  name = "Blog"
  pageRef = "/blog"
  weight = 1

[[menus.main]]
  identifier = "log"
  name = "Log"
  pageRef = "/log"
  weight = 2

[[menus.main]]
  identifier = "reference"
  name = "Reference"
  pageRef = "/reference"
  weight = 3

[[menus.main]]
  identifier = "docs"
  name = "Docs"
  pageRef = "/docs"
  weight = 4

[[menus.main]]
  identifier = "craft"
  name = "Craft"
  pageRef = "/craft"
  weight = 5

[[menus.main]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/HansF/whooplog"
  weight = 90
  [menus.main.params]
    icon = "github"

[[menus.main]]
  identifier = "search"
  weight = 98
  [menus.main.params]
    type = "search"

[[menus.main]]
  identifier = "theme-toggle"
  weight = 99
  [menus.main.params]
    type = "theme-toggle"

[params]
  displayUpdatedDate = true
  dateFormat = "2 January 2006"

  [params.theme]
    default = "system"
    displayToggle = true

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      # "full" indexes every substring, not just word prefixes. Needed so a search for
      # "srate" finds "roll_srate" — CLI variable names are the main thing looked up here.
      # Costs a larger index; negligible at this page count.
      tokenize = "full"

  [params.editURL]
    enable = true
    base = "https://github.com/HansF/whooplog/edit/main/content"

  [params.navbar]
    displayTitle = true
    displayLogo = false
    width = "normal"

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = true
    width = "normal"

  [params.page]
    width = "normal"

  [params.blog]
    [params.blog.list]
      displayTags = true

  [params.highlight]
    [params.highlight.copy]
      enable = true
      display = "hover"

  [params.imageZoom]
    enable = true
